  <defs>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8197b3"/>
      <stop offset=".55" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#93a8c2"/>
    </linearGradient>
    <linearGradient id="ir" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc061"/>
      <stop offset="1" stop-color="#ff3b30"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0b1426"/>
  <path d="M4 8.5H28L19.6 21H12.4Z" fill="url(#cone)"/>
