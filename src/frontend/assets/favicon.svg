<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SPHEREx Explorer">
  <!-- Ícone original e estilizado da sonda SPHEREx (escudo fotônico cônico em camadas sobre o corpo).
